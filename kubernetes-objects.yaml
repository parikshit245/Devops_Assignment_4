apiVersion: v1
kind: Namespace
metadata:
  name: assignment-8
---
apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod
  namespace: assignment-8
  labels:
    app: nginx-pod
spec:
  containers:
    - name: nginx
      image: nginx:stable-alpine
      ports:
        - containerPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: assignment-8
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:stable-alpine
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: db-secret
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  namespace: assignment-8
spec:
  type: ClusterIP
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-nodeport
  namespace: assignment-8
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30082
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-loadbalancer
  namespace: assignment-8
spec:
  type: LoadBalancer
  selector:
    app: nginx
  ports:
    - port: 8088
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: external-service
  namespace: assignment-8
spec:
  type: ExternalName
  externalName: api.github.com
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: assignment-8
data:
  APP_ENV: "production"
---
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: assignment-8
type: Opaque
stringData:
  username: "labuser"
  password: "dummy-lab-password"
