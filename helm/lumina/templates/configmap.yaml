apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lumina.fullname" . }}-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "lumina.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.config.nodeEnv | quote }}
  NEXT_TELEMETRY_DISABLED: {{ .Values.config.nextTelemetryDisabled | quote }}
